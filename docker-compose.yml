services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA beneath a major-version-specific directory.
      # Mount the documented parent so the database is genuinely persistent.
      - settlement-postgres:/var/lib/postgresql
      - .:/workspace:ro
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  cli:
    build:
      context: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    profiles: ["tools"]

volumes:
  settlement-postgres:
