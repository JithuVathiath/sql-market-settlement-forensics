<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">SQL Market Settlement Forensics architecture</title>
  <desc id="desc">SEC archives pass through secure Go ingestion into raw, core, mart, quality, and reporting layers in PostgreSQL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#102a43"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64d8cb"/></marker>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="55" y="58" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Evidence-Led Settlement Data Pipeline</text>
  <text x="55" y="88" fill="#9fb3c8" font-family="Inter,Arial,sans-serif" font-size="15">Every analytical row retains an immutable route back to its source file and row.</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="50" y="150" width="180" height="150" rx="16" fill="#173f5f" stroke="#4ea8de"/>
    <text x="140" y="190" text-anchor="middle" fill="#7dd3fc" font-size="16" font-weight="700">SEC Archives</text>
    <text x="140" y="220" text-anchor="middle" fill="#d9e2ec" font-size="13">Two files / month</text>
    <text x="140" y="245" text-anchor="middle" fill="#d9e2ec" font-size="13">Pipe-delimited text</text>
    <text x="140" y="270" text-anchor="middle" fill="#d9e2ec" font-size="13">Trailer controls</text>
    <rect x="290" y="125" width="210" height="200" rx="16" fill="#164e63" stroke="#22d3ee"/>
    <text x="395" y="165" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="700">Secure Ingestion</text>
    <text x="395" y="198" text-anchor="middle" fill="#d9e2ec" font-size="13">HTTPS allowlist</text>
    <text x="395" y="223" text-anchor="middle" fill="#d9e2ec" font-size="13">SHA-256 receipts</text>
    <text x="395" y="248" text-anchor="middle" fill="#d9e2ec" font-size="13">Streaming validation</text>
    <text x="395" y="273" text-anchor="middle" fill="#d9e2ec" font-size="13">Reject quarantine</text>
    <text x="395" y="298" text-anchor="middle" fill="#d9e2ec" font-size="13">Source-row lineage</text>
    <rect x="560" y="115" width="210" height="220" rx="16" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="665" y="155" text-anchor="middle" fill="#93c5fd" font-size="16" font-weight="700">PostgreSQL 18</text>
    <text x="665" y="190" text-anchor="middle" fill="#d9e2ec" font-size="13">raw · immutable text</text>
    <text x="665" y="220" text-anchor="middle" fill="#d9e2ec" font-size="13">core · typed partitions</text>
    <text x="665" y="250" text-anchor="middle" fill="#d9e2ec" font-size="13">mart · investigation views</text>
    <text x="665" y="280" text-anchor="middle" fill="#d9e2ec" font-size="13">audit · provenance</text>
    <text x="665" y="310" text-anchor="middle" fill="#d9e2ec" font-size="13">quality · contracts</text>
    <rect x="830" y="125" width="210" height="200" rx="16" fill="#214e34" stroke="#4ade80"/>
    <text x="935" y="165" text-anchor="middle" fill="#86efac" font-size="16" font-weight="700">Evidence Products</text>
    <text x="935" y="198" text-anchor="middle" fill="#d9e2ec" font-size="13">Market pulse</text>
    <text x="935" y="223" text-anchor="middle" fill="#d9e2ec" font-size="13">Concentration curves</text>
    <text x="935" y="248" text-anchor="middle" fill="#d9e2ec" font-size="13">Review queues</text>
    <text x="935" y="273" text-anchor="middle" fill="#d9e2ec" font-size="13">Reproducible reports</text>
    <text x="935" y="298" text-anchor="middle" fill="#d9e2ec" font-size="13">Measured query plans</text>
  </g>
  <g stroke="#64d8cb" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M230 225 H285"/><path d="M500 225 H555"/><path d="M770 225 H825"/></g>
  <rect x="240" y="390" width="720" height="55" rx="27" fill="#0b2239" stroke="#334e68"/>
  <text x="600" y="423" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15">Interpretation boundary: descriptive settlement stress ≠ evidence of misconduct</text>
</svg>
